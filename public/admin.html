<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ — SNG GAME BAR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body class="admin-body">

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1><span class="logo-badge">SNG</span> ADMIN</h1>
    <p>Пароль (только для админов)</p>
    <input type="password" id="pass" placeholder="Пароль" onkeydown="if(event.key==='Enter')login()">
    <button class="btn-primary" onclick="login()">Войти</button>
    <div class="status" id="loginStatus"></div>
  </div>
</div>

<div id="adminPanel" style="display:none">
  <header class="topbar">
    <div class="logo"><span class="logo-badge">SNG</span> ADMIN</div>
    <div class="topbar-actions">
      <a href="/" class="btn-ghost">🌐 Сайт</a>
      <button class="btn-ghost" onclick="logout()">Выйти</button>
    </div>
  </header>

  <div class="stats-row" id="statsRow"></div>

  <div class="tabs">
    <button class="tab active" data-tab="orders">📥 Заявки</button>
    <button class="tab" data-tab="games">🎮 Игры</button>
    <button class="tab" data-tab="payments">💳 Реквизиты</button>
  </div>

  <section id="tab-orders" class="tab-content active">
    <div class="orders-filter">
      <button class="filter-btn active" data-status="all">Все</button>
      <button class="filter-btn" data-status="pending">⏳ В работе</button>
      <button class="filter-btn" data-status="done">✅ Выполнено</button>
      <button class="filter-btn" data-status="rejected">❌ Отклонено</button>
    </div>
    <div id="ordersList"></div>
  </section>

  <section id="tab-games" class="tab-content">
    <button class="btn-primary" onclick="addGame()">+ Игра</button>
    <div id="gamesAdmin" style="margin-top:20px"></div>
  </section>

  <section id="tab-payments" class="tab-content">
    <button class="btn-primary" onclick="addPayment()">+ Реквизит</button>
    <div id="paymentsAdmin" style="margin-top:20px"></div>
  </section>
</div>

<script src="/admin.js"></script>
</body>
</html>
